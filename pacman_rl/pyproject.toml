[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pacman-rl"
version = "0.1.0"
description = "PPO vs DQN trên Ms. Pacman (Atari)"
readme = "README.md"
requires-python = ">=3.10"
# torch KHÔNG ghi ở đây: cài riêng bản CUDA (xem README) để pip không kéo bản CPU đè lên.
dependencies = [
    "numpy<2",
    "gymnasium==0.29.1",
    "ale-py>=0.9,<0.11",
    "opencv-python",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pacman-rl = "pacman_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
